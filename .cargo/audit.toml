# cargo audit settings for both Rust projects (client/mls, desktop), run by CI.
# Every ignored advisory needs a reason and is re-checked when openmls or Tauri
# are updated. Anything new fails the build.

[advisories]
ignore = [
  # crypto-bigint 0.5 (via p256 / elliptic-curve 0.13 in openmls's crypto backend):
  # timing variability in its P-256 arithmetic. Our only MLS ciphersuite is
  # X25519 + Ed25519, so P-256 code never runs. The fix needs crypto-bigint 0.7,
  # which openmls_rust_crypto 0.6 does not support yet.
  "RUSTSEC-2026-0387",
  # libcrux-kem 0.0.9: listed in Cargo.lock as an optional dependency of hpke-rs
  # that we do not enable; it is not compiled (`cargo tree -i libcrux-kem` is empty).
  "RUSTSEC-2026-0330",
  "RUSTSEC-2026-0331",
]
