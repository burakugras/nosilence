# SPDX-License-Identifier: AGPL-3.0-only
# Builds the Windows desktop app and publishes it as a GitHub Release with a signed
# update (ADR 0014). Start it by pushing a tag `desktop-v<version>` whose version
# matches desktop/tauri.conf.json. Installed apps find the new version through
# releases/latest/download/latest.json and accept it only if it carries a valid
# signature for the public key in tauri.conf.json.
#
# A tag `desktop-v<version>-rc.<n>` makes a pre-release instead: built and signed the
# same way, but GitHub does not count it as the latest release, so installed apps
# never see it. It tries the whole path with the real key before a real release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the
# update signing key; Burak keeps the original).
name: Desktop release

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if (-not ($tag -match "^desktop-v$([regex]::Escape($version))(-rc\.\d+)?$")) {
            throw "Tag $tag does not match tauri.conf.json version $version"
          }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          "PRERELEASE=$([bool]$Matches[1])" | Out-File -Append $env:GITHUB_ENV

      - name: The update public key is set
        shell: pwsh
        run: |
          $key = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $key -or $key -eq 'PUBKEY_PLACEHOLDER') {
            throw 'Put the update public key into desktop/tauri.conf.json first (README: Desktop releases).'
          }

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      # The client (with the MLS WebAssembly module) is embedded in the app.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.1 --locked
      - run: npm ci
        working-directory: client
      - run: npm run build:mls
        working-directory: client
      - run: npm ci
        working-directory: desktop

      - name: Build the installer and the signed update
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":true}}' | Out-File -Encoding utf8NoBOM release.json
          npx tauri build --config release.json

      # Installed apps would refuse an update signed by any other key.
      - name: The update is signed by the key the app trusts
        shell: pwsh
        run: |
          $setup = "desktop/target/release/bundle/nsis/Nosilence_${env:VERSION}_x64-setup.exe"
          node tools/verify-update-signature.mjs $setup "$setup.sig" desktop/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish the release
        working-directory: desktop/target/release/bundle/nsis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = "Nosilence_${env:VERSION}_x64-setup.exe"
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = "Nosilence $env:VERSION"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content "$setup.sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$setup"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM latest.json
          if ($env:PRERELEASE -eq 'True') {
            $title = "Nosilence ${env:VERSION} (${{ github.ref_name }}, pre-release)"
            $notes = "Trial build of the release path. Installed apps do not update to it."
            $kind = '--prerelease'
          } else {
            $title = "Nosilence $env:VERSION"
            $notes = "Windows desktop app $env:VERSION. Installed apps update themselves."
            $kind = '--latest'
          }
          gh release create "${{ github.ref_name }}" $setup "$setup.sig" latest.json `
            --repo "${{ github.repository }}" --title $title --notes $notes $kind
