[package]
name = "mls-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
openmls = { version = "0.9.2", features = ["js"] }
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
wasm-bindgen = "0.2.130"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true

# Browser randomness: older crates in the tree (rand_core 0.6) use getrandom 0.2,
# which needs its "js" feature on wasm32. openmls's own "js" feature covers getrandom 0.4.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
