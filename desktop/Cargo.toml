[package]
name = "nosilence-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Nosilence desktop app: a Tauri shell around the client"

[lib]
name = "nosilence_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Signed updates from GitHub Releases (ADR 0014) and restarting into them.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Desktop notifications for new messages (ADR 0014).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! embeds the plugin configuration as JSON.
serde_json = "1"
# Session token in the OS credential store (Windows Credential Manager; macOS Keychain later).
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# Google sign-in through the system browser (RFC 8252 loopback + PKCE).
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "macros"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
open = "5"
form_urlencoded = "1"
# nosilence:// invite links (ADR 0018): one running app, which gets the link.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"

# Push-to-talk: polls the state of the chosen keys (src/ptt.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
